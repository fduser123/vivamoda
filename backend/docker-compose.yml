services:
  postgres:
    # pgvector en lugar de postgres:16-alpine: es el MISMO PostgreSQL 16 (el
    # volumen de datos sigue siendo válido) pero con la extensión vector, que
    # es la que guarda los embeddings de FashionCLIP para el asistente RAG y la
    # búsqueda visual. Evita levantar un servicio aparte.
    image: pgvector/pgvector:pg16
    container_name: vivamoda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivamoda
      POSTGRES_PASSWORD: vivamoda_dev
      POSTGRES_DB: vivamoda
    ports:
      - "5432:5432"
    volumes:
      - vivamoda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivamoda -d vivamoda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vivamoda_pgdata:
