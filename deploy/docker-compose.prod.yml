# ============================================================
# VivaModa completo en una sola VM (Oracle Cloud Always Free)
#
#   cd deploy
#   cp .env.prod.example .env      # y rellena POSTGRES_PASSWORD, JWT_SECRET, SITE_ADDRESS
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Cuatro contenedores: PostgreSQL+pgvector, sidecar FashionCLIP, backend Node
# y Caddy (TLS automático). Todo escucha en la red interna; solo Caddy publica.
# ============================================================

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivamoda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: vivamoda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivamoda -d vivamoda"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  sidecar:
    build:
      context: ..
      dockerfile: deploy/sidecar.Dockerfile
    restart: unless-stopped
    environment:
      EMBED_HOST: 0.0.0.0
      PORT: "8001"
    volumes:
      - hf_cache:/app/.cache/huggingface

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      # TRUST_PROXY=1: hay exactamente un proxy delante (Caddy). Sin esto,
      # req.ip es la IP del contenedor de Caddy y el rate limit de IA
      # castigaría a todos los visitantes como si fueran uno solo.
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://vivamoda:${POSTGRES_PASSWORD}@db:5432/vivamoda
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en deploy/.env}
      EMBED_SERVICE_URL: http://sidecar:8001
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-2}
      AI_RATE_LIMIT_PER_MIN: ${AI_RATE_LIMIT_PER_MIN:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      sidecar:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio público. Sin dominio propio, usa la IP de la VM con sslip.io:
      #   SITE_ADDRESS=203.0.113.10.sslip.io
      SITE_ADDRESS: ${SITE_ADDRESS:?falta SITE_ADDRESS en deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  hf_cache:
  caddy_data:
  caddy_config:
