<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VivaModa · Tienda Virtual en Realidad Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: #170f1c; font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; }
  #sceneCanvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  #sceneCanvas:active { cursor: grabbing; }
  .glass { background: rgba(23, 15, 28, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.10); }
  .chip { transition: all .2s ease; }
  .chip:hover { transform: translateY(-1px); }
  .chip.active { background: #e4006c; color: #fff; border-color: transparent; box-shadow: 0 6px 20px -6px rgba(228,0,108,.55); }
  ::-webkit-scrollbar { display: none; }
  @keyframes vmfade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: vmfade .35s ease; }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
  #loader { transition: opacity .6s ease; }
  #productCard { animation: vmfade .28s ease; }
</style>
</head>
<body>

<!-- ═══════════ Cargando ═══════════ -->
<div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center gap-4 bg-[#170f1c]">
  <div class="w-12 h-12 rounded-full border-4 border-white/10 border-t-[#e4006c] animate-spin"></div>
  <p class="font-semibold text-white/80 text-sm tracking-wide">Preparando la Tienda Virtual en 3D…</p>
</div>

<!-- ═══════════ Canvas 3D ═══════════ -->
<canvas id="sceneCanvas"></canvas>

<!-- ═══════════ Barra superior ═══════════ -->
<header class="fixed top-0 inset-x-0 z-40">
  <div class="max-w-[1440px] mx-auto px-4 pt-3 flex flex-col sm:flex-row items-center justify-between gap-2">
    <div class="glass rounded-full pl-3 pr-4 py-1.5 flex items-center gap-2.5">
      <a href="/catalogo-de-productos" class="flex items-center gap-2 group" title="Volver a la tienda">
        <span class="w-7 h-7 rounded-lg bg-gradient-to-br from-[#e4006c] to-[#4b41e1] flex items-center justify-center font-extrabold text-sm text-white shadow-lg">V</span>
        <span class="font-extrabold tracking-tight text-white group-hover:text-[#ff8ab5] transition-colors">VivaModa</span>
      </a>
      <span class="h-4 w-px bg-white/15"></span>
      <span class="inline-flex items-center gap-1.5 font-bold text-[11px] uppercase tracking-widest text-[#ff8ab5]">
        <span class="w-1.5 h-1.5 rounded-full bg-[#ff5c9a] pulse-dot"></span>Tienda VR
      </span>
    </div>

    <!-- Zonas -->
    <nav id="zoneChips" class="glass rounded-full px-2 py-1.5 flex items-center gap-1 overflow-x-auto max-w-full"></nav>

    <div class="flex items-center gap-2">
      <button id="tourBtn" class="glass chip rounded-full px-3.5 py-2 text-xs font-bold text-white/90 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base">360</span><span id="tourLabel">Recorrido</span>
      </button>
      <button id="fsBtn" class="glass chip rounded-full px-3 py-2 text-xs font-bold text-white/90 flex items-center gap-1.5" title="Pantalla completa">
        <span class="material-symbols-outlined text-base">fullscreen</span><span class="hidden md:inline">Fullscreen</span>
      </button>
        <a href="/catalogo-de-productos" class="glass chip rounded-full px-3.5 py-2 text-xs font-bold text-white flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base">storefront</span><span class="hidden md:inline">Volver a la tienda</span>
      </a>
    </div>
  </div>
</header>

<!-- ═══════════ Barra del cliente (avatar + selector de género) ═══════════ -->
<div id="clientBar" class="fixed top-16 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2">
  <div class="glass rounded-full px-3 py-1.5 flex items-center gap-2">
    <span id="clientAvatar" class="text-2xl"></span>
    <span id="clientLabel" class="text-[11px] font-bold uppercase tracking-widest text-white/80">Cliente</span>
    <span class="w-1 h-1 rounded-full bg-white/20"></span>
    <select id="genderSelect" class="bg-transparent text-[11px] font-bold uppercase tracking-widest text-white/80 border border-white/20 rounded-full pl-2 pr-5 py-0.5 appearance-none cursor-pointer outline-none">
      <option value="damas" class="bg-[#170f1c]">Damas</option>
      <option value="caballeros" class="bg-[#170f1c]">Caballeros</option>
      <option value="ninos" class="bg-[#170f1c]">Niños</option>
    </select>
  </div>
</div>

<!-- ═══════════ Ayuda inferior ═══════════ -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 glass rounded-full px-4 py-2 text-[11px] font-semibold text-white/75 whitespace-nowrap overflow-x-auto max-w-[94vw]">
  <span class="material-symbols-outlined text-[14px] align-[-2px] text-[#ff8ab5]">pan_tool_alt</span> Arrastra para mirar ·
  <span class="material-symbols-outlined text-[14px] align-[-2px] text-[#ff8ab5]">zoom_in</span> Rueda para acercar ·
  <span class="material-symbols-outlined text-[14px] align-[-2px] text-[#ff8ab5]">ads_click</span> Toca un producto para verlo
</div>

<!-- ═══════════ Tarjeta de producto ═══════════ -->
<div id="productCard" class="fixed bottom-6 right-4 z-50 w-[320px] max-w-[calc(100vw-2rem)] hidden">
  <div class="bg-white text-[#1c1b1d] rounded-2xl shadow-[0_24px_60px_-12px_rgba(0,0,0,0.6)] overflow-hidden fade-in">
    <div class="h-1.5 bg-gradient-to-r from-[#e4006c] via-[#8f7bff] to-[#4b41e1]"></div>
    <div class="p-5">
      <div class="flex items-start justify-between gap-3">
        <span id="cardZone" class="text-[10px] font-extrabold uppercase tracking-widest px-2 py-1 rounded-full bg-[#ffe3ef] text-[#b60055]">Zona</span>
        <button id="cardClose" class="w-7 h-7 rounded-full bg-[#f6f2f5] hover:bg-[#eae7ea] flex items-center justify-center text-[#5c3f45] transition-colors">
          <span class="material-symbols-outlined text-base">close</span>
        </button>
      </div>
      <div id="cardImgWrap" class="relative w-full h-44 rounded-xl overflow-hidden bg-gradient-to-br from-[#f6f2f5] to-[#e5e1e4] flex items-center justify-center mt-2.5">
        <img id="cardImg" class="hidden w-full h-full object-cover" alt="Foto del producto"/>
        <span id="cardImgEmoji" class="text-5xl"></span>
      </div>
      <h3 id="cardName" class="font-extrabold text-lg leading-snug mt-2.5"></h3>
      <p id="cardMeta" class="text-[13px] text-[#5c3f45] mt-1"></p>
      <div class="flex items-baseline gap-2 mt-3">
        <span id="cardPrice" class="font-extrabold text-2xl text-[#b60055]"></span>
        <span id="cardCompare" class="text-sm text-[#906e75] line-through hidden"></span>
        <span id="cardBadge" class="hidden text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-[#4b41e1] text-white"></span>
      </div>
      <div class="flex gap-2 mt-4">
        <a id="cardLink" href="#" class="flex-1 text-center rounded-xl bg-[#b60055] hover:bg-[#e4006c] text-white text-sm font-bold py-2.5 transition-colors">Ver detalle en la tienda</a>
      </div>

      <!-- Cuidado del producto (inyectado desde la tarjeta) -->
      <div id="cardCareWrap" class="mt-4 pt-3 border-t border-[#e5e1e4] hidden">
        <div class="flex items-start gap-2">
          <span class="material-symbols-outlined text-base mt-0.5 text-[#b60055]">cleaning_services</span>
          <div class="">
            <p id="cardCare" class="text-[12px] font-semibold text-[#1c1b1d]"></p>
            <p id="cardMaterials" class="text-[11px] text-[#5c3f45] mt-0.5"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ Motor 3D (Three.js) ═══════════ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- ═══════════ Partes de la tienda (módulos) ═══════════ -->
<script src="/js/pages/vr-store/core.js"></script>
<script src="/js/pages/vr-store/estructura.js"></script>
<script src="/js/pages/vr-store/percheros.js"></script>
<script src="/js/pages/vr-store/estantes.js"></script>
<script src="/js/pages/vr-store/espejos.js"></script>
<script src="/js/pages/vr-store/mobiliario.js"></script>
<script src="/js/pages/vr-store/ropa.js"></script>
<script src="/js/pages/vr-store/secciones.js"></script>
<script src="/js/pages/vr-store/letreros.js"></script>
<script src="/js/pages/vr-store/interaccion.js"></script>
<script src="/js/pages/vr-store/avatar-client.js"></script>
<script src="/js/pages/vr-store/mode-fps.js"></script>
<script>VRStore.init();</script>
</body>
</html>
