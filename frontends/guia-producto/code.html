<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VivaModa · Guía de tu prenda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/responsive.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .vm-tip { animation: vmIn .45s ease both; }
    @keyframes vmIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="bg-[#fcf8fb] text-[#1c1b1d] min-h-screen" style="font-family:'Plus Jakarta Sans',sans-serif">
  <main id="vm-guia-root" class="max-w-md mx-auto px-4 py-6 pb-24">
    <div class="flex items-center justify-center py-16 text-[#b60055]">
      <span class="material-symbols-outlined animate-spin text-3xl">progress_activity</span>
    </div>
  </main>
</body>
</html>
