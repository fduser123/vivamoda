# ============================================================
# Despliegue del backend Node.js en Render (plan gratuito)
#
# Coloca este archivo en la RAÍZ del repositorio. Render lo detecta solo.
# Las variables marcadas como sync:false se introducen a mano en el panel.
# ============================================================
services:
  - type: web
    name: vivamoda-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # --- Base de datos (Supabase) ---
      - key: DATABASE_URL
        sync: false
      # --- Sidecar de embeddings (Hugging Face Space) ---
      - key: EMBED_SERVICE_URL
        sync: false
      # --- Proveedor de IA ---
      - key: DEEPSEEK_API_KEY
        sync: false
      # --- Seguridad: genera uno nuevo, NO reutilices el de desarrollo ---
      - key: JWT_SECRET
        sync: false
      # --- Opcionales (imágenes del probador virtual) ---
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
